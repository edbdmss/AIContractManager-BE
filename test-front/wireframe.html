<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIContractManager 화면 와이어프레임</title>
  <style>
    :root { font: 14px/1.45 system-ui, -apple-system, sans-serif; color: #202124; background: #eef1f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .workspace { width: min(1240px, calc(100% - 32px)); margin: 28px auto; }
    .topbar { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 18px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 24px; }
    .muted { color: #68707d; }
    .layout { display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }
    .screen-list, .note-panel { background: #fff; border: 1px solid #d7dce3; border-radius: 8px; padding: 14px; }
    .screen-list h2, .note-panel h2 { font-size: 15px; margin-bottom: 10px; }
    .screen-button { width: 100%; display: flex; gap: 10px; align-items: center; border: 1px solid transparent; border-radius: 5px; background: transparent; color: #303640; text-align: left; padding: 9px 10px; cursor: pointer; }
    .screen-button:hover, .screen-button.active { border-color: #bcc8dc; background: #f1f5fb; }
    .number { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid #aeb7c4; border-radius: 50%; font-size: 12px; }
    .preview-wrap { display: grid; grid-template-columns: minmax(320px, 390px) 1fr; gap: 18px; align-items: start; }
    .phone { min-height: 720px; background: #fafafa; border: 8px solid #252a32; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 30px #25304722; }
    .phone-top { height: 26px; background: #252a32; }
    .phone-body { padding: 22px 18px 18px; }
    .phone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .phone-header h2 { font-size: 21px; }
    .icon-button { width: 34px; height: 34px; border: 1px solid #c6cdd8; border-radius: 50%; background: #fff; color: #303640; cursor: pointer; }
    .hero { border: 1px solid #d4dae2; background: #fff; border-radius: 8px; padding: 18px; margin-bottom: 12px; }
    .hero h3 { font-size: 18px; margin-bottom: 8px; }
    .metric { display: flex; justify-content: space-between; align-items: end; margin-top: 18px; }
    .metric strong { font-size: 28px; }
    .chips, .actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip, .tag { border: 1px solid #cbd2dd; border-radius: 999px; background: #fff; padding: 5px 9px; color: #4e5968; }
    .primary { border: 1px solid #202124; border-radius: 5px; background: #202124; color: #fff; padding: 10px 12px; cursor: pointer; }
    .outline { border: 1px solid #aeb7c4; border-radius: 5px; background: #fff; color: #303640; padding: 9px 11px; cursor: pointer; }
    .card { border: 1px solid #d5dbe3; border-radius: 7px; background: #fff; padding: 13px; margin-bottom: 9px; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .row + .row { margin-top: 9px; }
    .contract-name { font-weight: 700; }
    .amount { font-weight: 700; }
    .divider { height: 1px; background: #e0e4ea; margin: 16px 0; }
    .bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin: 24px -18px -18px; border-top: 1px solid #d8dde5; padding: 9px 8px 12px; background: #fff; }
    .bottom-nav button { border: 0; background: transparent; color: #68707d; padding: 5px 2px; font-size: 11px; cursor: pointer; }
    .bottom-nav button.active { color: #202124; font-weight: 700; }
    .bar { height: 10px; border-radius: 2px; background: #dce1e8; margin: 7px 0; }
    .bar.short { width: 58%; }
    .bar.tiny { width: 30%; height: 8px; }
    .contract-document { min-height: 180px; border: 1px dashed #aeb7c4; background: #fff; padding: 16px; }
    .detail { display: grid; grid-template-columns: 110px 1fr; gap: 9px 12px; }
    .detail dt { color: #68707d; }
    .detail dd { margin: 0; font-weight: 600; }
    .risk { border-left: 4px solid #b42318; background: #fff2f0; padding: 11px; margin-top: 14px; }
    .chat { min-height: 390px; display: flex; flex-direction: column; justify-content: end; gap: 10px; }
    .bubble { max-width: 82%; border-radius: 12px; padding: 10px 12px; background: #edf0f4; }
    .bubble.user { align-self: end; background: #202124; color: #fff; }
    .input-line { display: flex; gap: 7px; margin-top: 14px; }
    .input-line input { flex: 1; border: 1px solid #c5ccd6; border-radius: 5px; padding: 10px; }
    .notes { min-height: 350px; }
    .notes h2 { margin-bottom: 12px; }
    .notes ul { margin: 0; padding-left: 20px; }
    .notes li { margin: 8px 0; }
    .flow { margin-top: 16px; padding: 12px; border-top: 1px solid #e0e4ea; color: #68707d; }
    @media (max-width: 900px) { .layout, .preview-wrap { grid-template-columns: 1fr; } .screen-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; } .screen-list h2 { grid-column: 1 / -1; } .phone { max-width: 390px; margin: auto; } }
    @media (max-width: 520px) { .workspace { width: min(100% - 18px, 390px); margin: 16px auto; } .screen-list { grid-template-columns: 1fr; } .phone { min-height: 680px; } }
  </style>
</head>
<body>
<main class="workspace">
  <div class="topbar">
    <div><p class="muted">AIContractManager</p><h1>화면 와이어프레임</h1></div>
    <p class="muted">사진의 1~8 화면 흐름을 클릭해서 확인하세요.</p>
  </div>
  <div class="layout">
    <nav class="screen-list" aria-label="화면 목록">
      <h2>화면 목록</h2>
      <button class="screen-button active" data-screen="home"><span class="number">1</span><span>로그인 / 시작</span></button>
      <button class="screen-button" data-screen="dashboard"><span class="number">2</span><span>홈 대시보드</span></button>
      <button class="screen-button" data-screen="contracts"><span class="number">3</span><span>계약 목록</span></button>
      <button class="screen-button" data-screen="analysis"><span class="number">4</span><span>계약서 AI 분석</span></button>
      <button class="screen-button" data-screen="detail"><span class="number">5</span><span>계약 상세</span></button>
      <button class="screen-button" data-screen="chat"><span class="number">6</span><span>챗봇</span></button>
      <button class="screen-button" data-screen="suggestions"><span class="number">7</span><span>결제 제안</span></button>
      <button class="screen-button" data-screen="calendar"><span class="number">8</span><span>캘린더 / 알림</span></button>
    </nav>
    <section class="preview-wrap">
      <div class="phone" id="phone-preview"></div>
      <aside class="note-panel" id="screen-notes"></aside>
    </section>
  </div>
</main>
<script>
  const screens = {
    home: {
      title: "로그인 / 시작",
      notes: ["카카오·네이버 로그인 진입", "로그인 전에는 계약 정보와 알림을 노출하지 않음", "로그인 성공 후 홈 대시보드로 이동"],
      html: `<div class="phone-body"><div class="phone-header"><h2>계약을 한곳에서 관리</h2></div><div class="hero"><div class="bar short"></div><div class="bar"></div><div class="bar tiny"></div><div class="metric"><span class="muted">내 계약을 안전하게 정리하세요</span></div></div><div class="actions"><button class="primary" data-next="dashboard">카카오 로그인</button><button class="outline" data-next="dashboard">네이버 로그인</button></div><div class="flow">로그인 → 계약 등록 → AI 분석 → 일정 알림</div></div>`
    },
    dashboard: {
      title: "홈 대시보드",
      notes: ["이번 달 고정비를 가장 먼저 보여줌", "다가오는 갱신·해지 행동을 우선순위로 표시", "결제 알림에서 발견한 계약 후보를 하단에 배치"],
      html: `<div class="phone-body"><div class="phone-header"><h2>안녕하세요, 사용자님</h2><button class="icon-button">설정</button></div><div class="hero"><p class="muted">이번 달 고정비</p><div class="metric"><strong>₩218,000</strong><span class="tag">3개 계약</span></div><div class="bar" style="margin-top:18px"></div><div class="bar short"></div></div><div class="row" style="margin:18px 0 9px"><h3>이번 주 할 일</h3><button class="outline" data-next="calendar">전체 보기</button></div><div class="card"><div class="row"><span class="contract-name">헬스장 자동갱신</span><span class="tag">14일 뒤</span></div><p class="muted">이번 주까지 해지 신청 필요</p></div><div class="card"><div class="row"><span class="contract-name">넷플릭스 결제 후보</span><span class="tag">확인 필요</span></div><p class="muted">월 17,000원 결제가 3회 발견됨</p></div><div class="bottom-nav"><button class="active">홈</button><button data-next="contracts">계약</button><button data-next="calendar">일정</button><button data-next="chat">챗봇</button></div></div>`
    },
    contracts: {
      title: "계약 목록",
      notes: ["계약명, 월 금액, 다음 행동을 한 카드에 표시", "직접 등록과 결제 알림 기반 제안을 같은 목록에서 연결", "계약 카드를 누르면 상세 화면으로 이동"],
      html: `<div class="phone-body"><div class="phone-header"><h2>내 계약</h2><button class="icon-button">검색</button></div><div class="chips"><span class="chip">전체 3</span><span class="chip">렌털</span><span class="chip">구독</span><button class="chip" data-next="analysis">+ 등록</button></div><div style="margin-top:18px"><div class="card" data-next="detail"><div class="row"><span class="contract-name">주택 임대차 계약</span><span class="tag">정상</span></div><div class="row"><span class="muted">보증금 1,000만원</span><span class="amount">월 500,000원</span></div><p class="muted">갱신일 2027.10.31</p></div><div class="card" data-next="detail"><div class="row"><span class="contract-name">동네 헬스장</span><span class="tag">확인 필요</span></div><div class="row"><span class="muted">자동갱신 14일 전</span><span class="amount">월 50,000원</span></div></div><div class="card" data-next="suggestions"><div class="row"><span class="contract-name">넷플릭스</span><span class="tag">등록 제안</span></div><div class="row"><span class="muted">결제 3회 발견</span><span class="amount">월 17,000원</span></div></div></div><div class="bottom-nav"><button data-next="dashboard">홈</button><button class="active">계약</button><button data-next="calendar">일정</button><button data-next="chat">챗봇</button></div></div>`
    },
    analysis: {
      title: "계약서 AI 분석",
      notes: ["사진·파일 업로드 후 OCR과 조항 추출 진행", "금액과 날짜는 사용자가 원문 대조 후 확인", "분석 결과를 저장하기 전에 수정 가능"],
      html: `<div class="phone-body"><div class="phone-header"><button class="icon-button">뒤로</button><h2>계약서 등록</h2><span></span></div><div class="contract-document"><p class="muted">파일을 업로드하세요</p><div class="bar" style="margin-top:28px"></div><div class="bar"></div><div class="bar short"></div><div class="actions" style="margin-top:30px"><button class="primary">사진 촬영</button><button class="outline">파일 선택</button></div></div><div class="card" style="margin-top:14px"><div class="row"><strong>업종 초안</strong><span class="tag">선택 사항</span></div><p class="muted">주택 임대차 표준 조건을 바탕으로 먼저 채워드립니다.</p></div><button class="primary" style="width:100%; margin-top:8px" data-next="detail">분석 결과 보기</button></div>`
    },
    detail: {
      title: "계약 상세",
      notes: ["핵심 조항을 구조화된 필드로 제공", "위험 가능성은 법적 단정 없이 원문과 함께 표시", "문서 원문과 추출 결과를 오가며 확인"],
      html: `<div class="phone-body"><div class="phone-header"><button class="icon-button" data-next="contracts">뒤로</button><h2>주택 임대차 계약</h2><button class="icon-button">수정</button></div><div class="card"><div class="row"><span class="tag">PENDING_VERIFICATION</span><span class="muted">문서 1개</span></div><dl class="detail" style="margin-top:16px"><dt>계약 기간</dt><dd>2026.11.01 ~ 2027.10.31</dd><dt>월 금액</dt><dd>500,000원 <span class="tag">확인 필요</span></dd><dt>자동 갱신일</dt><dd>2027.10.31</dd><dt>해지 조건</dt><dd>만료 1개월 전 신청</dd></dl></div><div class="risk"><strong>확인할 조항</strong><p>자동 갱신 조건이 적용되는지 원문을 확인하세요.</p><button class="outline" style="margin-top:8px">원문 보기</button></div><div class="actions" style="margin-top:16px"><button class="primary">금액 확인 완료</button><button class="outline" data-next="calendar">일정 보기</button></div></div>`
    },
    chat: {
      title: "챗봇",
      notes: ["계약 상세에서 선택한 계약을 문맥으로 사용", "해지 절차와 서비스 이용 안내 중심", "법률 판단이 아닌 확인할 내용과 행동을 안내"],
      html: `<div class="phone-body"><div class="phone-header"><button class="icon-button" data-next="dashboard">뒤로</button><h2>계약 도우미</h2><button class="icon-button">도움말</button></div><div class="chat"><div class="bubble">어떤 계약의 해지 방법이 궁금한가요?</div><div class="bubble user">헬스장 계약을 해지하고 싶어요.</div><div class="bubble">계약서의 해지 신청 기한을 먼저 확인하세요. 현재 등록된 계약은 갱신 14일 전까지 신청이 필요합니다.</div></div><div class="input-line"><input placeholder="질문을 입력하세요"><button class="primary">전송</button></div></div>`
    },
    suggestions: {
      title: "결제 기반 등록 제안",
      notes: ["안드로이드 결제 알림에서 추출한 사업자명과 금액을 표시", "사용자가 정기결제 여부와 주기를 최종 확인", "수락하면 계약 등록 화면의 초안으로 이동"],
      html: `<div class="phone-body"><div class="phone-header"><button class="icon-button" data-next="contracts">뒤로</button><h2>등록 제안</h2><button class="icon-button">닫기</button></div><div class="hero"><p class="muted">정기 결제로 보이는 항목</p><h3>넷플릭스</h3><div class="metric"><strong>17,000원</strong><span class="tag">매월</span></div><p class="muted" style="margin-top:8px">최근 결제 2026.10.25 · 신뢰도 높음</p></div><div class="card"><h3>계약으로 등록할까요?</h3><p class="muted">결제 알림만으로 계약 조건을 확정하지 않습니다. 계약서를 업로드하면 AI가 조건을 채워드립니다.</p><div class="actions" style="margin-top:14px"><button class="primary" data-next="analysis">계약 등록</button><button class="outline" data-next="contracts">나중에</button></div></div></div>`
    },
    calendar: {
      title: "캘린더 / 알림",
      notes: ["갱신일과 해지 가능일을 한 화면에서 비교", "날짜보다 행동 지침을 먼저 보여줌", "알림을 읽음·완료 상태로 변경 가능"],
      html: `<div class="phone-body"><div class="phone-header"><h2>일정</h2><button class="icon-button">필터</button></div><div class="hero"><div class="row"><strong>2026년 11월</strong><span class="muted">월간 보기</span></div><div class="bar" style="margin-top:20px"></div><div class="bar"></div><div class="bar short"></div></div><div class="card"><div class="row"><span class="tag">D-14</span><strong>헬스장 자동갱신</strong></div><p class="muted">이번 주까지 해지 신청 필요</p><button class="outline" style="margin-top:8px">완료 처리</button></div><div class="card"><div class="row"><span class="tag">D-42</span><strong>주택 임대차 갱신일</strong></div><p class="muted">갱신 의사와 조건을 확인하세요.</p></div><div class="bottom-nav"><button data-next="dashboard">홈</button><button data-next="contracts">계약</button><button class="active">일정</button><button data-next="chat">챗봇</button></div></div>`
    }
  };

  const phone = document.getElementById("phone-preview");
  const notes = document.getElementById("screen-notes");
  function showScreen(key) {
    const screen = screens[key];
    phone.innerHTML = `<div class="phone-top"></div>${screen.html}`;
    notes.innerHTML = `<h2>${screen.title}</h2><p class="muted">사진의 화면 구조를 기반으로 한 MVP 와이어프레임입니다.</p><div class="divider"></div><ul>${screen.notes.map(note => `<li>${note}</li>`).join("")}</ul>`;
    document.querySelectorAll(".screen-button").forEach(button => button.classList.toggle("active", button.dataset.screen === key));
    phone.querySelectorAll("[data-next]").forEach(element => element.addEventListener("click", () => showScreen(element.dataset.next)));
  }
  document.querySelectorAll(".screen-button").forEach(button => button.addEventListener("click", () => showScreen(button.dataset.screen)));
  showScreen("home");
</script>
</body>
</html>
